# ============================================================
# Nginx Configuration for K8s Frontend
# ============================================================
#
# WHAT THIS DOES:
#   1. Serves static files (index.html, app.js, styles.css)
#   2. Reverse-proxies /api/* requests to the backend K8s Service
#
# WHY? (Kubernetes concept: Service-to-Service Communication)
#   → The frontend and backend are separate Pods in K8s.
#   → The browser can't call "backend-service:5000" directly
#     (that's a cluster-internal DNS name).
#   → So Nginx acts as a bridge: it receives browser requests on
#     port 80 and forwards /api/* to the backend Service internally.
#
#   Browser → [NodePort] → Frontend Pod (Nginx)
#                              ├── /           → serves index.html
#                              └── /api/*      → proxy to backend-service:5000
#
# HOW IT WORKS IN K8S:
#   "backend-service" is a K8s Service name. K8s DNS automatically
#   resolves it to the correct Pod IP(s). Nginx doesn't need to know
#   which Pod or which node — K8s handles the routing.
# ============================================================

server {
    listen 80;
    server_name _;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA-style routing (return index.html for unknown paths)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the backend K8s Service
    # "backend-service" is the K8s Service name defined in k8s/backend-service.yaml
    location /api/ {
        proxy_pass http://backend-service:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
