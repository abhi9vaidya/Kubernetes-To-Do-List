# ============================================================
# Secret — Sensitive Configuration
# ============================================================
# A Secret is like a ConfigMap, but for SENSITIVE data:
# passwords, API keys, tokens, certificates.
#
# WHY SECRETS instead of ConfigMaps for passwords?
#   → Secrets are base64 encoded (not encrypted by default, but
#     can be encrypted at rest with K8s encryption config).
#   → They have stricter RBAC — you can allow devs to read
#     ConfigMaps but restrict Secret access to admins only.
#   → They're stored separately in etcd and can be mounted as
#     files or injected as env vars.
#
# HOW TO ENCODE:
#   echo -n "admin" | base64          → YWRtaW4=
#   echo -n "password123" | base64    → cGFzc3dvcmQxMjM=
#
# IMPORTANT: In production, you'd use:
#   → External secret managers (AWS Secrets Manager, Vault)
#   → Sealed Secrets (encrypted in Git, decrypted in cluster)
#   → Never commit real credentials to Git!
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  labels:
    app: todo-app
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  MONGO_INITDB_ROOT_PASSWORD: cGFzc3dvcmQxMjM=
