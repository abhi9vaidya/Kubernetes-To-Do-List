# ============================================================
# Frontend Service (NodePort)
# ============================================================
#
# WHY NODEPORT for the frontend?
#   → NodePort exposes the service on a static port on EVERY node.
#   → This makes it accessible from OUTSIDE the cluster.
#   → Users access the To-Do app at http://<node-ip>:30080
#
# SERVICE TYPES COMPARED:
#   ClusterIP (default):
#     → Internal only. Used for backend and MongoDB.
#     → Other Pods can reach it, but external users cannot.
#
#   NodePort:
#     → Exposes on a port (30000-32767) on every node.
#     → Good for development/testing.
#     → Users access it directly via node IP + port.
#
#   LoadBalancer:
#     → For cloud (AWS, GCP, Azure).
#     → Provisions an actual cloud load balancer with a public IP.
#     → The production upgrade from NodePort.
#
#   Ingress (bonus):
#     → An API gateway / reverse proxy at the cluster edge.
#     → Routes by URL path or hostname (like Nginx in the cloud).
#     → The most production-ready option.
#
# PORT 30080:
#   → NodePort range is 30000-32767.
#   → We pick 30080 for easy memorization (8080 → 30080).
#   → Access: http://localhost:30080
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: todo-app
    tier: frontend
spec:
  type: NodePort
  selector:
    app: todo-app
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
